name: Deploy Site to OSS

on:
  workflow_call:
    inputs:
      build_dir:
        required: true
        type: string
        description: '构建产物目录，如 build/ 或 dist/ 或 src/site/dist/'
      oss_bucket:
        required: true
        type: string
        description: 'OSS 桶名，如 qtweb-site'
      cdn_domains:
        required: true
        type: string
        description: 'CDN 域名列表，JSON 数组格式，如 ["https://quanttide.com/"]'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - uses: manyuanrong/setup-ossutil@v3
        with:
          endpoint: oss-cn-hangzhou.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload to OSS
        run: ossutil cp ${{ inputs.build_dir }} oss://${{ inputs.oss_bucket }}/ -r -f --meta=Cache-Control:public,max-age=31536000

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          import json, os
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          domains = json.loads('${{ inputs.cdn_domains }}')
          for domain in domains:
              req = RefreshObjectCachesRequest()
              req.set_ObjectPath(domain)
              req.set_ObjectType('Directory')
              cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}